<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHVIP — Finaliser la réservation</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#0c0c0c;
color:white;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.card{
background:#111;
padding:30px;
border-radius:10px;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border-radius:6px;
border:none;
}

button{
background:#c6a46c;
color:black;
padding:14px;
border:none;
border-radius:6px;
cursor:pointer;
width:100%;
font-weight:bold;
}

.summary{
background:#151515;
padding:20px;
border-radius:10px;
margin-bottom:30px;
}

.label{
color:#aaa;
font-size:13px;
}

.value{
font-size:16px;
margin-bottom:10px;
}

</style>

  <!-- ═══ SHvip Tracker ═══════════════════════════════════════════════════
       Remplacez 192.168.1.142 par votre IP publique si accès depuis internet.
  ════════════════════════════════════════════════════════════════════════ -->
  <script src="http://192.168.1.142:5055/shvip-tracker.js" defer></script>
</head>

<body>

<div class="container">

<h1>Finaliser votre réservation</h1>

<div class="summary">

<div class="label">Référence</div>
<div id="ref" class="value"></div>

<div class="label">Trajet</div>
<div id="trajet" class="value"></div>

<div class="label">Date</div>
<div id="date" class="value"></div>

<div class="label">Véhicule</div>
<div id="vehicule" class="value"></div>

<div class="label">Prix estimé</div>
<div id="prix" class="value"></div>

</div>

<div class="card">

<form id="form">

<label>Nom</label>
<input id="nom" required>

<label>Téléphone</label>
<input id="telephone" required>

<label>Email</label>
<input id="email">

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">
Envoyer la demande
</button>

</form>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const reference = params.get("reference") || "";
const depart = params.get("depart") || "";
const arrivee = params.get("arrivee") || "";
const date = params.get("date") || "";
const vehicule = params.get("vehicule") || "";
const prix = params.get("prix") || "Sur devis";

document.getElementById("ref").innerText = reference;
document.getElementById("trajet").innerText = depart + " → " + arrivee;
document.getElementById("date").innerText = date;
document.getElementById("vehicule").innerText = vehicule;
document.getElementById("prix").innerText = prix + " €";

document.getElementById("form").addEventListener("submit", async function(e) {

  e.preventDefault();

  const btn = e.target.querySelector("button");
  btn.textContent = "Envoi en cours…";
  btn.disabled = true;

  const SUPABASE_URL  = "https://htblfillncczsfteciyy.supabase.co";
  const SUPABASE_KEY  = "sb_publishable_yh-guGKPlaJBtqCxAtC0QA_N12x0zyA";

  const payload = {
    reference:    reference,
    nom:          document.getElementById("nom").value,
    telephone:    document.getElementById("telephone").value,
    email:        document.getElementById("email").value,
    depart:       depart,
    arrivee:      arrivee,
    date_course:  date,
    type_vehicule: vehicule,
    prix:         prix,
    notes:        document.getElementById("notes").value,
    statut:       "En attente"
  };

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/reservations`, {
      method: "POST",
      headers: {
        "Content-Type":  "application/json",
        "apikey":        SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer":        "return=minimal"
      },
      body: JSON.stringify(payload)
    });

    if (res.ok || res.status === 201) {
      btn.textContent = "✓ Demande envoyée !";
      btn.style.background = "#4caf82";
      setTimeout(() => { window.location.href = "/"; }, 2500);
    } else {
      const err = await res.text();
      throw new Error(`Erreur ${res.status} : ${err}`);
    }
  } catch(err) {
    btn.textContent = "Envoyer la demande";
    btn.disabled = false;
    alert("Erreur lors de l'envoi : " + err.message + "\nVérifiez votre connexion et réessayez.");
    console.error("Supabase error:", err);
  }

});

</script>

</body>
</html>
